[package]
name = "glint"
version = "0.1.0"
edition = "2021"
description = "A production-grade LLM inference engine built from scratch in Rust"
license = "MIT"

[lib]
name = "glint"
crate-type = ["rlib", "cdylib"]  # cdylib needed for wasm-pack; maturin also expects it for Python

[features]
default = ["rayon", "server"]
rayon = ["dep:rayon"]

# HTTP server + model-download CLI (axum, tokio, reqwest).
# Excluded from wasm builds — browsers have no server or filesystem pull.
server = [
  "dep:axum", "dep:tokio", "dep:tower-http",
  "dep:tokio-stream", "dep:reqwest", "dep:indicatif", "dep:dirs",
]

# Enable PyO3 Python extension module. Build with: cargo build --features python
# or let maturin handle it via pyproject.toml.
python = ["pyo3/extension-module"]

# Enable wasm-bindgen JS bindings. Build with:
#   wasm-pack build --target web --no-default-features --features wasm
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:console_error_panic_hook"]

# Enable GPU compute backend via wgpu (Vulkan/Metal/DX12). Build with:
#   cargo build --release --features vulkan
vulkan = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

# Expose a C-compatible ABI (opaque handles + #[no_mangle] functions). Build with:
#   cargo build --release --features cffi
# A C header is generated at include/glint.h via cbindgen in build.rs.
cffi = []

# Reserved gate for full Jinja2 template evaluation via minijinja.
# Currently a compile-time stub that returns an error — wires in the interface
# so that adding the minijinja dependency later doesn't break the feature matrix.
# Build with: cargo build --features full-jinja
full-jinja = []

[dependencies]
# Memory-mapped file I/O — lets us map the GGUF file directly into virtual memory
# instead of reading it all into the heap. The OS handles paging data in/out.
memmap2 = "0.9"

# f16 (half-precision float) support — GGUF uses f16 for quantization scale factors.
# Rust doesn't have a native f16 type, so this crate provides one.
half = "2.4"

# Convenient little-endian/big-endian integer and float reading from byte slices.
byteorder = "1.5"

# CLI argument parser — derive macros make it declarative and type-safe.
clap = { version = "4", features = ["derive"] }

# Ergonomic error types — lets us define custom error enums with Display/Error impls
# using a simple derive macro instead of manual boilerplate.
thiserror = "2"

# Data parallelism — work-stealing thread pool for parallelizing matmul across rows.
# Optional so the wasm32 target (single-threaded) can exclude it.
rayon = { version = "1.10", optional = true }

# HTTP server framework built on tokio — handler-based routing, SSE streaming.
axum = { version = "0.8", features = ["macros"], optional = true }

# Async runtime — drives the HTTP server and provides spawn_blocking for CPU work.
tokio = { version = "1", features = ["full"], optional = true }

# JSON serialization/deserialization for the OpenAI-compatible API.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Bridges tokio mpsc channels to async streams (used for SSE token streaming).
tokio-stream = { version = "0.1", optional = true }

# HTTP middleware — CORS headers for browser-based API clients.
tower-http = { version = "0.6", features = ["cors"], optional = true }

# Async HTTP client with streaming body — used for downloading models from HuggingFace.
reqwest = { version = "0.12", features = ["stream", "json"], optional = true }

# Terminal progress bars — used to show download progress.
indicatif = { version = "0.17", optional = true }

# Cross-platform user/cache directory paths (e.g. ~/.cache or %LOCALAPPDATA%).
dirs = { version = "5", optional = true }

# Python bindings — only compiled when the `python` feature is enabled.
pyo3 = { version = "0.22", optional = true }

# WASM / browser bindings — only compiled when the `wasm` feature is enabled.
wasm-bindgen           = { version = "0.2",  optional = true }
js-sys                 = { version = "0.3",  optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

# GPU compute via wgpu — Vulkan/Metal/DX12 backend for accelerated inference.
wgpu     = { version = "24",  optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1",   features = ["derive"], optional = true }

[dev-dependencies]
# Creates temporary files/directories for tests that auto-clean on drop.
tempfile = "3"

# Micro-benchmarking framework — statistical analysis, warmup, outlier detection.
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "matvec"
harness = false
